<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>철도역 이용 경험 조사 사전 테스트</title>
<meta property="og:title" content="철도역 이용 경험 조사 사전 테스트">
<meta property="og:description" content="본조사 전 질문 이해도를 확인하는 사전 테스트입니다. 약 10분 · 끝까지 응답하시면 메가커피 아메리카노 모바일 쿠폰을 드립니다.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://forzahjkim.github.io/railway-survey/">
<meta property="og:image" content="https://forzahjkim.github.io/railway-survey/og.png?v=1">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="철도역 이용 경험 조사 사전 테스트">
<meta property="og:locale" content="ko_KR">
<meta property="og:site_name" content="한국철도공사 설문">
<meta name="twitter:card" content="summary_large_image">
<meta name="description" content="본조사 전 질문 이해도를 확인하는 사전 테스트입니다. 약 10분 · 끝까지 응답하시면 메가커피 아메리카노 모바일 쿠폰을 드립니다.">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  --primary:#005BAC; --secondary:#2E7ABF; --card:#EFF5FB; --cell:#DCEAF7;
  --hair:#CFE0EE; --ink:#3B3B3E; --muted:#77777A; --cyan:#00B2E3;
  --bg:#F4F7FA; --white:#FFFFFF; --alert:#B3261E;
}
html{font-size:17px}
html.big{font-size:21px}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Pretendard,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  background:var(--bg); color:var(--ink); line-height:1.55;
  -webkit-text-size-adjust:100%;
}
#app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg)}
/* ---------- fixed header ---------- */
header{position:sticky;top:0;z-index:10;background:var(--white);border-bottom:1px solid var(--hair)}
.hd-top{display:flex;align-items:center;justify-content:space-between;padding:.6rem .9rem .45rem}
.hd-title{font-size:.92rem;font-weight:700;color:var(--primary);letter-spacing:-.01em}
.font-btn{border:1.5px solid var(--hair);background:var(--white);color:var(--ink);border-radius:8px;
  padding:.25rem .55rem;font-size:.8rem;font-weight:700;cursor:pointer;font-family:inherit}
.font-btn.on{background:var(--primary);border-color:var(--primary);color:#fff}
.station-banner{background:var(--card);color:var(--primary);font-size:.85rem;font-weight:500;
  text-align:center;padding:.4rem .9rem;border-top:1px solid var(--hair)}
.station-banner b{font-weight:700}
.pbar{height:5px;background:var(--hair)}
.pbar>i{display:block;height:100%;background:var(--primary);width:0%;transition:width .25s ease}
@media (prefers-reduced-motion:reduce){.pbar>i{transition:none}}
.pnum{font-size:.72rem;color:var(--muted);text-align:right;padding:.15rem .9rem .3rem;background:var(--white)}
/* ---------- content ---------- */
main{flex:1;padding:1.1rem .95rem 7.5rem}
.qno{display:inline-block;background:var(--primary);color:#fff;font-size:.78rem;font-weight:700;
  border-radius:999px;padding:.14rem .7rem;margin-bottom:.55rem;letter-spacing:.02em}
.qtitle{font-size:1.22rem;font-weight:700;letter-spacing:-.015em;margin-bottom:.35rem;text-wrap:balance;word-break:keep-all}
.qsub{font-size:.92rem;color:var(--muted);margin-bottom:.9rem}
.req{color:var(--secondary);font-weight:700}
/* option cards */
.opt{display:flex;align-items:flex-start;gap:.65rem;width:100%;text-align:left;background:var(--white);
  border:1.5px solid var(--hair);border-radius:12px;padding:.85rem .9rem;margin-bottom:.55rem;
  font-size:1.06rem;font-family:inherit;color:var(--ink);cursor:pointer;min-height:3.4rem;line-height:1.5}
.opt .dot{flex:0 0 auto;width:1.25rem;height:1.25rem;border-radius:50%;border:2px solid var(--hair);
  margin-top:.12rem;position:relative;background:var(--white)}
.opt.multi .dot{border-radius:6px}
.opt.sel{border-color:var(--primary);background:var(--cell);font-weight:700}
.opt.sel .dot{border-color:var(--primary);background:var(--primary)}
.opt.sel .dot::after{content:"";position:absolute;left:.3rem;top:.09rem;width:.3rem;height:.6rem;
  border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.opt:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
/* likert item */
.lk{background:var(--white);border:1.5px solid var(--hair);border-radius:12px;padding:.9rem .9rem .75rem;margin-bottom:.7rem}
.lk-q{font-size:1rem;font-weight:500;margin-bottom:.7rem;line-height:1.5}
.lk-row{display:flex;gap:.3rem}
.lk-row button{flex:1;min-height:4.1rem;border:1.5px solid var(--hair);background:var(--white);
  border-radius:9px;font-family:inherit;font-size:.8rem;line-height:1.25;color:var(--muted);
  cursor:pointer;padding:.3rem .1rem;word-break:keep-all}
.lk-row button b{display:block;font-size:1rem;color:var(--ink);font-weight:700;margin-bottom:.12rem}
.lk-row button.sel{background:var(--primary);border-color:var(--primary);color:#EAF3FB}
.lk-row button.sel b{color:#fff}
.lk-row button:focus-visible{outline:3px solid var(--cyan);outline-offset:1px}
.lk-picked{font-size:.92rem;color:var(--primary);font-weight:700;margin-top:.5rem;min-height:1.2rem}
/* info screens */
.card{background:var(--white);border:1.5px solid var(--hair);border-radius:14px;padding:1.15rem 1rem;margin-bottom:.8rem}
.card p{margin-bottom:.6rem;font-size:.98rem}
.card p:last-child{margin-bottom:0}
.intro-hero{background:var(--white);border:1.5px solid var(--hair);border-radius:14px;overflow:hidden;margin-bottom:.8rem}
.intro-bar{height:6px;background:var(--cyan)}
.intro-body{padding:1.3rem 1.1rem 1.2rem}
.intro-body h1{font-size:1.45rem;font-weight:700;color:var(--primary);letter-spacing:-.02em;margin-bottom:.3rem;text-wrap:balance}
.intro-body .sub{font-size:.9rem;color:var(--muted)}
.notice{background:var(--card);border-radius:10px;padding:.8rem .9rem;font-size:.9rem;margin-top:.9rem}
.notice p{margin-bottom:.4rem}.notice p:last-child{margin-bottom:0}
.pilot-note{font-size:.8rem;color:var(--muted);margin-top:1rem;line-height:1.6}
.admin-link{display:block;margin:1.6rem auto 0;background:none;border:none;color:#A9B4BE;font-size:.76rem;
  text-decoration:underline;cursor:pointer;font-family:inherit}
/* phone */
.phone-row{display:flex;align-items:center;gap:.45rem;background:var(--white);border:1.5px solid var(--hair);
  border-radius:12px;padding:.9rem}
.phone-row span{font-size:1.1rem;font-weight:700}
.phone-row input{width:6.2rem;font-size:1.15rem;font-family:inherit;text-align:center;border:none;
  border-bottom:2px solid var(--hair);padding:.25rem 0;background:transparent;color:var(--ink);border-radius:0}
.phone-row input:focus{outline:none;border-bottom-color:var(--primary)}
/* error */
.err{display:none;align-items:center;gap:.4rem;color:var(--alert);font-size:.88rem;font-weight:700;margin:.3rem 0 .2rem}
.err.show{display:flex}
/* feedback */
.fb-box{margin-top:1.3rem;border-top:1px dashed var(--hair);padding-top:.8rem}
.fb-toggle{background:none;border:none;color:var(--muted);font-size:.82rem;cursor:pointer;
  font-family:inherit;text-decoration:underline;padding:.2rem 0}
.fb-area{display:none;margin-top:.5rem}
.fb-area.open{display:block}
.fb-guide{font-size:.78rem;color:#98A2AB;margin-bottom:.4rem;line-height:1.55}
.fb-area textarea{width:100%;min-height:4.5rem;border:1.5px solid var(--hair);border-radius:10px;
  padding:.6rem .7rem;font-family:inherit;font-size:.92rem;color:var(--ink);background:var(--white);resize:vertical}
.fb-area textarea:focus{outline:none;border-color:var(--secondary)}
.fb-saved{font-size:.75rem;color:var(--secondary);margin-top:.25rem;min-height:1rem}
/* footer nav */
.navbar{position:fixed;bottom:0;left:0;right:0;z-index:10;background:var(--white);
  border-top:1px solid var(--hair);padding:.7rem .95rem calc(.7rem + env(safe-area-inset-bottom))}
.nav-in{max-width:520px;margin:0 auto;display:flex;gap:.6rem}
.btn{flex:1;min-height:3.5rem;border-radius:12px;font-size:1.15rem;font-weight:700;font-family:inherit;cursor:pointer;border:none}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:active{background:#004a8d}
.btn-ghost{flex:0 0 30%;background:var(--white);color:var(--muted);border:1.5px solid var(--hair)}
.btn:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
/* done / screenout */
.done-icon{width:3.4rem;height:3.4rem;border-radius:50%;background:var(--primary);margin:0 auto 1rem;position:relative}
.done-icon::after{content:"";position:absolute;left:1.15rem;top:.78rem;width:.75rem;height:1.4rem;
  border:solid #fff;border-width:0 4px 4px 0;transform:rotate(45deg)}
.center{text-align:center}
.save-status{font-size:.85rem;margin-top:.8rem;color:var(--muted)}
.copy-fallback{margin-top:1rem;text-align:left}
.copy-fallback textarea{width:100%;min-height:5rem;font-size:.72rem;border:1.5px solid var(--hair);
  border-radius:10px;padding:.5rem;font-family:monospace;background:var(--white);color:var(--ink)}
.mini-btn{background:var(--card);border:1.5px solid var(--hair);color:var(--primary);font-weight:700;
  border-radius:9px;padding:.5rem .9rem;font-size:.88rem;cursor:pointer;font-family:inherit;margin:.35rem .35rem .35rem 0}
/* 안내 카드 — 체크 아이콘 + 블루 강조 */
.guide-card{background:var(--white);border:1.5px solid var(--hair);border-radius:14px;
  padding:1.15rem 1.05rem 1.1rem;margin-bottom:.8rem;box-shadow:0 1px 3px rgba(0,91,172,.06)}
.guide-head{font-size:1.14rem;font-weight:500;color:var(--ink);margin-bottom:.95rem;
  padding-bottom:.8rem;border-bottom:2px solid var(--cell);word-break:keep-all}
.guide-head b{color:var(--primary);font-weight:700}
.checklist{list-style:none;display:flex;flex-direction:column;gap:.85rem}
.checklist li{position:relative;padding-left:2rem;font-size:1rem;line-height:1.6;word-break:keep-all}
.checklist li::before{content:"";position:absolute;left:0;top:.08rem;width:1.4rem;height:1.4rem;
  border-radius:50%;background:var(--primary)}
.checklist li::after{content:"";position:absolute;left:.5rem;top:.36rem;width:.34rem;height:.68rem;
  border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.checklist b{color:var(--primary);font-weight:700}
/* 중점 문항 이해도 확인 블록 */
.deep-q{font-size:.98rem;font-weight:700;color:var(--iv-ink);margin:.15rem 0 .6rem;line-height:1.55;word-break:keep-all}
.deep-opts{display:flex;flex-direction:column;gap:.4rem}
.deep-opt{display:flex;align-items:flex-start;gap:.55rem;width:100%;text-align:left;
  background:#fff;border:1.5px solid var(--iv-line);border-radius:10px;padding:.65rem .7rem;
  font-family:inherit;font-size:.97rem;line-height:1.45;color:var(--ink);cursor:pointer;min-height:2.9rem}
.deep-opt .dot{flex:0 0 auto;width:1.1rem;height:1.1rem;border-radius:50%;
  border:2px solid var(--iv-line);margin-top:.15rem;position:relative;background:#fff}
.deep-opt.sel{border-color:var(--iv-accent);background:#FDF8EC;font-weight:700}
.deep-opt.sel .dot{border-color:var(--iv-accent);background:var(--iv-accent)}
.deep-opt.sel .dot::after{content:"";position:absolute;left:.26rem;top:.06rem;width:.26rem;height:.54rem;
  border:solid #fff;border-width:0 2.2px 2.2px 0;transform:rotate(45deg)}
.deep-opt:focus-visible{outline:3px solid var(--iv-accent);outline-offset:2px}
.deep-more{background:none;border:none;color:var(--iv-ink);font-family:inherit;font-size:.85rem;
  text-decoration:underline;cursor:pointer;padding:.5rem 0 .1rem}
.deep-note{display:none;margin-top:.2rem}
.deep-note.open{display:block}
/* interviewer recording zone */
:root{--iv-bg:#FBF5E3; --iv-line:#E2D2A4; --iv-ink:#6E5B1E; --iv-accent:#A8842B}
.iv{background:var(--iv-bg);border:1.5px dashed var(--iv-line);border-radius:12px;
  padding:.8rem .85rem;margin-top:1.3rem}
.iv-head{display:flex;align-items:center;gap:.4rem;font-size:.82rem;font-weight:700;
  color:var(--iv-ink);margin-bottom:.6rem;letter-spacing:.02em}
.iv-head .tag{background:var(--iv-accent);color:#fff;border-radius:6px;padding:.05rem .45rem;font-size:.68rem}
.iv-label{font-size:.8rem;font-weight:700;color:var(--iv-ink);margin:.55rem 0 .3rem}
.und-row{display:flex;gap:.4rem}
.und-row button{flex:1;min-height:2.7rem;border-radius:9px;border:1.5px solid var(--iv-line);
  background:#fff;font-family:inherit;font-size:.9rem;font-weight:700;color:var(--iv-ink);cursor:pointer}
.und-row button.sel{background:var(--primary);border-color:var(--primary);color:#fff}
.iv input[type=text],.iv textarea{width:100%;border:1.5px solid var(--iv-line);border-radius:9px;
  padding:.5rem .6rem;font-family:inherit;font-size:.9rem;background:#fff;color:var(--ink)}
.iv textarea{min-height:3.6rem;resize:vertical}
.iv input:focus,.iv textarea:focus{outline:none;border-color:var(--iv-accent)}
.deep{background:#fff;border:1.5px solid var(--iv-line);border-radius:10px;padding:.7rem .75rem;margin-top:.7rem}
.deep-title{font-size:.85rem;font-weight:700;color:var(--iv-ink);margin-bottom:.25rem}
.deep-why{font-size:.75rem;color:var(--muted);margin-bottom:.5rem;line-height:1.5}
.mis-row{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.45rem}
.mis-row button{border:1.5px solid var(--iv-line);background:#fff;border-radius:999px;
  padding:.3rem .65rem;font-size:.76rem;font-family:inherit;color:var(--iv-ink);cursor:pointer}
.mis-row button.sel{background:var(--iv-accent);border-color:var(--iv-accent);color:#fff;font-weight:700}
.chip-grid{display:flex;flex-wrap:wrap;gap:.4rem}
.chip-grid button{border:1.5px solid var(--hair);background:var(--white);border-radius:999px;
  padding:.5rem .8rem;font-size:.9rem;font-family:inherit;color:var(--ink);cursor:pointer;min-height:2.6rem}
.chip-grid button.sel{background:var(--cell);border-color:var(--primary);color:var(--primary);font-weight:700}
.form-row{margin-bottom:.9rem}
.form-row>label{display:block;font-size:.85rem;font-weight:700;color:var(--primary);margin-bottom:.35rem}
.form-row input[type=text]{width:100%;border:1.5px solid var(--hair);border-radius:10px;
  padding:.65rem .7rem;font-family:inherit;font-size:1rem;background:var(--white);color:var(--ink)}
.form-row input[type=text]:focus{outline:none;border-color:var(--primary)}
.mode-chip{background:var(--iv-accent);color:#fff;font-size:.66rem;font-weight:700;border-radius:6px;
  padding:.1rem .4rem;margin-left:.35rem;vertical-align:middle}
/* admin */
#adminView{display:none}
.ad-stat{display:flex;gap:.5rem;margin-bottom:.8rem;flex-wrap:wrap}
.ad-stat .tile{flex:1 1 28%;background:var(--white);border:1.5px solid var(--hair);border-radius:12px;padding:.7rem .8rem}
.ad-stat .tile b{display:block;font-size:1.4rem;color:var(--primary);font-variant-numeric:tabular-nums}
.ad-stat .tile span{font-size:.75rem;color:var(--muted)}
.ad-sec{font-size:1rem;font-weight:700;color:var(--primary);margin:1.2rem 0 .5rem}
.fb-item{background:var(--white);border:1.5px solid var(--hair);border-radius:10px;padding:.6rem .8rem;margin-bottom:.5rem;font-size:.88rem}
.fb-item .who{font-size:.72rem;color:var(--muted);margin-bottom:.15rem}
.badge-focus.bad{background:#FBE9E7;color:var(--alert)}
.badge-focus{display:inline-block;background:var(--cell);color:var(--primary);font-size:.68rem;font-weight:700;
  border-radius:6px;padding:.05rem .4rem;margin-left:.3rem;vertical-align:middle}
.ad-table-wrap{overflow-x:auto;background:var(--white);border:1.5px solid var(--hair);border-radius:12px}
table{border-collapse:collapse;font-size:.75rem;min-width:900px}
th,td{border-bottom:1px solid var(--hair);padding:.35rem .5rem;text-align:center;white-space:nowrap;font-variant-numeric:tabular-nums}
th{background:var(--card);color:var(--primary);font-weight:700;position:sticky;top:0}
.muted{color:var(--muted)}
/* ===== V2 추가 컴포넌트 ===== */
.sec-label{display:inline-block;font-size:.74rem;font-weight:700;color:var(--muted);letter-spacing:.02em;
  border:1px solid var(--hair);border-radius:6px;padding:.1rem .5rem;margin-bottom:.5rem;background:var(--white)}
.org-row{display:flex;gap:.6rem;margin-top:.9rem;flex-wrap:wrap}
.org-row>div{flex:1 1 45%;background:var(--card);border-radius:10px;padding:.55rem .7rem;font-size:.85rem;line-height:1.45}
.org-row span{display:block;font-size:.72rem;color:var(--muted)}
.org-row b{color:var(--primary);word-break:keep-all}
details.law{margin-top:.8rem;font-size:.8rem;color:var(--muted);line-height:1.5}
details.law summary{cursor:pointer;color:var(--primary);font-weight:700;font-size:.82rem}
details.law p{margin-top:.35rem}
.chip-grid.sido button{flex:1 1 30%;min-height:3rem;border-radius:12px;font-size:1rem}
.chip-grid.sido button:last-child{flex:1 1 100%}
.reward-form{background:var(--white);border:1.5px solid var(--hair);border-radius:14px;padding:1rem .95rem .6rem}
.reward-form.off .form-row{opacity:.4}
.reward-form .phone-row{border:none;padding:.2rem 0}
.chk-row{display:flex;align-items:flex-start;gap:.6rem;padding:.7rem .2rem .4rem;border-top:1px dashed var(--hair);
  margin-top:.4rem;font-size:1rem;cursor:pointer;line-height:1.45}
.chk-row input{width:1.35rem;height:1.35rem;margin-top:.1rem;accent-color:var(--primary);flex:0 0 auto}
.chk-row small{color:var(--muted);font-size:.85rem}
.modal-bg{position:fixed;inset:0;background:rgba(20,40,70,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:1rem}
.modal-bg[hidden]{display:none}
.modal{background:var(--white);border-radius:16px;padding:1.3rem 1.1rem 1rem;width:100%;max-width:400px;box-shadow:0 8px 30px rgba(0,0,0,.2)}
.modal-title{font-size:1.15rem;font-weight:700;color:var(--primary);text-align:center;margin-bottom:.7rem}
.modal-phone{font-size:1.6rem;font-weight:700;text-align:center;letter-spacing:.04em;color:var(--ink);margin:.3rem 0 .5rem;font-variant-numeric:tabular-nums}
.modal-btns{display:flex;gap:.6rem;margin-top:1rem}
.modal-btns .btn{min-height:3.1rem;font-size:1.05rem}
.modal-btns .btn-ghost{flex:1}
input:disabled{background:#F1F4F7 !important;color:#9AA5B0}
.pick-count{display:inline-block;font-size:.86rem;font-weight:700;color:var(--primary);background:var(--card);
  border-radius:999px;padding:.25rem .75rem;margin:-.35rem 0 .75rem}
.pick-count.full{background:var(--primary);color:#fff}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="hd-top">
      <div class="hd-title">철도역 이용 경험 조사<span class="mode-chip" id="modeChip" hidden>사전 테스트</span></div>
      <button class="font-btn" id="fontBtn" aria-pressed="false" onclick="toggleFont()">가 크게</button>
    </div>
    <div class="station-banner" id="stBanner" hidden></div>
    <div class="pbar" aria-hidden="true"><i id="pfill"></i></div>
    <div class="pnum" id="pnum"></div>
  </header>
  <main id="main" aria-live="polite"></main>
  <div class="navbar" id="navbar">
    <div class="nav-in">
      <button class="btn btn-ghost" id="btnPrev" onclick="goPrev()">이전</button>
      <button class="btn btn-primary" id="btnNext" onclick="goNext()">다음</button>
    </div>
  </div>
  <div class="modal-bg" id="modalBg" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-title" id="modalTitle"></div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-btns" id="modalBtns"></div>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script>
/* =====================================================================
   철도역 이용 경험 조사 — 모바일 프로토타입 V2 (설문지 「김형중 수정 V2」 9/4 + 9/4 확정안)
   MODE 'A' = 본조사 동일판 / 'B' = 사전 테스트판(이해도 점검 내장)
   응답 전송: Google Apps Script 웹앱 (config.js의 SURVEY_ENDPOINT)
   ===================================================================== */

function $(id){return document.getElementById(id)}
function el(html){var d=document.createElement('div');d.innerHTML=html;return d.firstChild}
function esc(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function pathIds(){
  var p=[];
  for(var i=0;i<SCREENS.length;i++){ var s=SCREENS[i]; if(s.cond&&!s.cond(A))continue; p.push(s.id); }
  return p;
}
function toggleFont(){
  var on=document.documentElement.classList.toggle('big');
  var b=$('fontBtn'); b.classList.toggle('on',on);
  b.textContent=on?'가 작게':'가 크게'; b.setAttribute('aria-pressed',on?'true':'false');
}

/* ===== render ===== */
function render(){
  var s=SCREENS[cur], m=$('main'); m.innerHTML='';
  LAST_SCREEN=s.id;
  var bn=$('stBanner');
  if(s.type==='ivinfo'||s.id==='ivguide'||s.type==='intro'||s.type==='done'){ bn.hidden=true; }
  else{ bn.innerHTML=(IS_B?'아래 질문은 <b>「'+esc(STATION)+'」</b>을 떠올리며 답해 주세요':'이 설문은 <b>「'+esc(STATION)+'」</b>을 기준으로 답해 주세요'); bn.hidden=false; }
  var p=pathIds(), pi=p.indexOf(s.id);
  var pct = s.type==='done' ? 100 : Math.round(pi/(p.length-1)*100);
  $('pfill').style.width=pct+'%';
  $('pnum').textContent = (s.type==='intro'||s.type==='done'||s.type==='ivinfo'||s.id==='ivguide')?'':(pct+'%');
  $('btnPrev').style.display = (cur===0||s.type==='done')?'none':'block';
  $('navbar').style.display = (s.type==='done')?'none':'block';
  $('btnNext').textContent = s.type==='intro' ? '설문 시작하기' : (s.type==='reward' ? '설문 완료' : '다음');

  if(s.type==='intro'){ renderIntro(m); return; }
  if(s.type==='ivinfo'){ renderIvInfo(m); return; }
  if(s.type==='info'){ m.appendChild(el(s.html)); addFeedback(m,s); return; }
  if(s.type==='done'){ renderDone(m); return; }
  if(s.type==='reward'){ renderReward(m); addErr(m); addFeedback(m,s); window.scrollTo(0,0); return; }

  var head=(s.sec?'<div class="sec-label">'+s.sec+'</div>':'')+
    '<span class="qno">'+s.no+(s.page?' · '+s.page:'')+'</span>'+
    '<div class="qtitle">'+s.title+' <span class="req" aria-hidden="true">*</span></div>'+
    (s.sub?'<div class="qsub">'+s.sub+'</div>':'')+
    (s.max?'<div class="pick-count'+(((A[s.id]||[]).length>=s.max)?' full':'')+'">최대 '+s.max+'개 중 <b>'+((A[s.id]||[]).length)+'개</b> 선택됨</div>':'');
  m.appendChild(el('<div>'+head+'</div>'));

  if(s.type==='single'){
    s.opts.forEach(function(t,i){
      var v=i+1, sel=A[s.id]===v;

  }
  if(s.type==='ivinfo'){
    if(!INFO.exp){showErr('무인역 이용 경험을 선택해 주세요.');return false;}
  }
  if(s.type==='reward'){
    if(!REWARD.optout){
      if(!REWARD.name){showErr('성함을 입력해 주세요. 답례품을 원하지 않으시면 아래 「입력을 원하지 않음」에 체크해 주세요.');return false;}
      if(REWARD.ph1.length!==4||REWARD.ph2.length!==4){showErr('휴대폰 번호를 끝까지 입력해 주세요. 원하지 않으시면 아래 「입력을 원하지 않음」에 체크해 주세요.');return false;}
    }
  }
  if(IS_B && QTYPES[s.type]){ if(!IV.und[s.id]){showErr('아래 노란 칸의 「질문 점검」에도 답해 주세요.');return false;} }
  return true;
}
function goNext(){
  var s=SCREENS[cur];
  if(s.type!=='intro'&&s.type!=='info'&&!validate(s))return;
  if(s.type==='intro'){ sendEvent('access'); }
  if(s.id==='sq1'&&(A.sq1===3||A.sq1===4)){ screenoutReason=A.sq1; renderScreenout(); return; }
  if(s.type==='reward'){
    if(!REWARD.optout){ confirmPhone(function(){ finishSurvey(); }); return; }
    finishSurvey(); return;
  }
  hist.push(cur);
  do{cur++;}while(SCREENS[cur].cond&&!SCREENS[cur].cond(A));
  render();
  sendProgress();
}
function goPrev(){ if(!hist.length)return; cur=hist.pop(); hideErr(); render(); }

/* 휴대폰 번호 재확인 팝업 (V2 [WEB] 요구) */
function confirmPhone(ok){
  openModal('입력하신 번호가 맞나요?',
    '<div class="modal-phone">010-'+esc(REWARD.ph1)+'-'+esc(REWARD.ph2)+'</div><p class="qsub" style="text-align:center;margin:0">이 번호로 모바일 쿠폰이 발송됩니다.</p>',
    [{t:'수정할게요',cls:'btn-ghost',f:closeModal},{t:'네, 맞습니다',cls:'btn-primary',f:function(){closeModal();ok();}}]);
}
function openModal(title,body,btns){
  $('modalTitle').textContent=title; $('modalBody').innerHTML=body;
  var bb=$('modalBtns'); bb.innerHTML='';
  btns.forEach(function(b){ var x=el('<button type="button" class="btn '+b.cls+'">'+b.t+'</button>'); x.onclick=b.f; bb.appendChild(x); });
  $('modalBg').hidden=false;
}
function closeModal(){ $('modalBg').hidden=true; }

function finishSurvey(){
  FINISHED=true;
  hist.push(cur); cur=SCREENS.length-1; render();
  submitFinal('complete');
}

/* ===== screen-out ===== */
function renderScreenout(){
  FINISHED=true; LAST_SCREEN='screenout';
  var m=$('main'); $('navbar').style.display='none'; $('pfill').style.width='100%'; $('pnum').textContent='';
  m.innerHTML='';
  if(IS_B){
    m.appendChild(el('<div class="card center" style="margin-top:2rem">'+
      '<p style="font-weight:700;font-size:1.15rem;color:var(--primary)">설문이 종료되었습니다.</p>'+
      '<p class="qsub">실제 조사에서는 이 지점에서 설문이 끝납니다. 그 역을 직접 이용하신 분만 대상으로 하기 때문입니다.</p>'+
      '<p class="qsub">사전 테스트에서는 <b>이 종료 화면이 제대로 나오는지</b>도 확인 대상이므로, 여기까지 오신 것으로 충분합니다. 감사합니다.</p>'+
      '<div class="save-status" id="saveStatus"></div><div id="fallbackBox"></div>'+
      '<button class="mini-btn" style="margin-top:1rem" onclick="location.reload()">처음부터 다시 해 보기</button></div>'));
  } else {
    m.appendChild(el('<div class="card center" style="margin-top:2rem">'+
      '<p style="font-weight:700;font-size:1.15rem;color:var(--primary)">설문이 종료되었습니다.</p>'+
      '<p class="qsub">이번 조사는 '+esc(STATION)+'을 직접 이용하신 분을 대상으로 합니다.<br>참여해 주셔서 감사합니다.</p>'+
      '<div class="save-status" id="saveStatus"></div><div id="fallbackBox"></div></div>'));
  }
  submitFinal('screenout');
}

/* ===== done ===== */
function renderDone(m){
  var rw = REWARD.optout ? '' : '<p class="qsub">‘메가커피 아메리카노 1개’ 모바일 쿠폰은 <b>9월 30일</b>에 입력해 주신 번호로 발송됩니다.</p>';
  if(IS_B){
    m.appendChild(el('<div class="card center" style="margin-top:1.5rem"><div class="done-icon" aria-hidden="true"></div>'+
      '<p style="font-weight:700;font-size:1.2rem;color:var(--primary)">사전 테스트가 끝났습니다.</p><p>끝까지 답해 주셔서 감사합니다.</p>'+
      '<p class="qsub">이번 조사는 실제 조사에 앞서 <b>질문이 잘 이해되는지 미리 확인하는 사전 테스트</b>였습니다. 답해 주신 내용과 「헷갈렸다」고 알려 주신 부분은 <b>설문 문항을 고치는 데에만</b> 쓰이며, 논문의 분석 자료로는 사용되지 않습니다.</p>'+rw+
      '<div class="save-status" id="saveStatus">응답을 저장하는 중…</div><div id="fallbackBox"></div></div>'));
  } else {
    m.appendChild(el('<div class="card center" style="margin-top:1.5rem"><div class="done-icon" aria-hidden="true"></div>'+
      '<p style="font-weight:700;font-size:1.2rem;color:var(--primary)">설문이 완료되었습니다.</p><p>소중한 의견 감사합니다.</p>'+rw+
      '<div class="save-status" id="saveStatus">응답을 저장하는 중…</div><div id="fallbackBox"></div></div>'));
  }
}

/* ===== 데이터 레코드 (평면 컬럼 — 시트 헤더와 1:1) ===== */
function bin(arr,n,pfx){ var o={}; for(var i=1;i<=n;i++){ o[pfx+'_'+i]=(arr&&arr.indexOf(i)>=0)?1:0; } return o; }
function buildRow(kind){
  var r={
    RESP_ID:RESP_ID, VERSION:MODE, KIND:kind, ACCESS_TS:ACCESS_TS, COMPLETE_TS:new Date().toISOString(),
    DUR_S:Math.round((Date.now()-T0)/1000), SCREENOUT_REASON: kind==='screenout'?screenoutReason:0,
    STATION:STATION, LAST_SCREEN:LAST_SCREEN, FONT_BIG:document.documentElement.classList.contains('big')?1:0, BUILD:BUILD,
    SQ1:A.sq1||'', SQ2:A.sq2||'', SQ3:A.sq3||'', SQ4:A.sq4||''
  };
  Object.assign(r, bin(A.sq7,7,'SQ7'));
  r.SQ8=A.sq8||''; r.SQ9=A.sq9||'';
  r.A1=A.A1||''; r.A2 = (A.sq2===2) ? 8 : (A.a2||''); r.A3=A.a3||'';
  ['BA1','BA2','BA3','BB1','BB2','BB3','BC1','BC2','BC3','BD1','BD2','BE1','BE2','B5','B6'].forEach(function(k){ r[k]=A[k]||''; });
  r.B4=A.b4||''; r.B7_1=A.b7a||''; r.B7_2=A.b7b||'';
  Object.assign(r, bin(A.b8,8,'B8'));
  r.SQ5=A.sq5||''; r.SQ6=A.sq6||''; r.SQ6_TXT=A.sq6_txt||'';
  r.REWARD_OPTOUT = REWARD.optout?1:0;
  r.REWARD_ENTERED = (!REWARD.optout && REWARD.ph1.length===4 && REWARD.ph2.length===4)?1:0;
  if(IS_B){
    r.INFO_VUL=INFO.vul.join(';'); r.INFO_EXP=INFO.exp;
    var ids=['sq1','sq2','sq3','sq4','sq7','sq8','sq9','a1','a2','a3','b1a','b1b','b1c','b2','b3','b4','b5','b6','b7a','b7b','b8','sq5','sq6','reward'];
    ids.forEach(function(id){ r['UND_'+id.toUpperCase()]=IV.und[id]||''; r['NOTE_'+id.toUpperCase()]=IV.note[id]||''; });
    Object.keys(DEEP).forEach(function(sid){ DEEP[sid].forEach(function(d){
      var v=IV.deep[d.k]||{pick:null,re:''};
      var pick=(v.pick===null||v.pick===undefined)?'':(v.pick+1);
      r['DEEP_'+d.k.toUpperCase()]=pick;
      r['DEEP_'+d.k.toUpperCase()+'_OK']= d.kind==='mc' ? (pick===''?'':(v.pick===d.ans?1:0)) : '';
      r['DEEP_'+d.k.toUpperCase()+'_RE']=v.re||'';
    }); });
  }
  return r;
}
function buildReward(){
  return {RESP_ID:RESP_ID, VERSION:MODE, NAME:REWARD.optout?'':REWARD.name,
          PHONE:(REWARD.optout||REWARD.ph1.length!==4)?'':('010-'+REWARD.ph1+'-'+REWARD.ph2),
          OPTOUT:REWARD.optout?1:0, TS:new Date().toISOString()};
}

/* ===== 전송: Google Apps Script 웹앱 ===== */
function postJSON(payload, opts){
  opts=opts||{};
  if(!ENDPOINT) return Promise.reject(new Error('no-endpoint'));
  var body=JSON.stringify(payload);
  if(opts.beacon && navigator.sendBeacon){ try{ if(navigator.sendBeacon(ENDPOINT, body)) return Promise.resolve({ok:true,beacon:true}); }catch(e){} }
  return fetch(ENDPOINT,{method:'POST',body:body,keepalive:!!opts.keepalive}).then(function(r){ return r.json(); });
}
function sendEvent(kind){ postJSON({type:'event', row:buildRow(kind)},{beacon:true}).catch(function(){}); }
var _progTimer=null;
function sendProgress(){
  clearTimeout(_progTimer);
  _progTimer=setTimeout(function(){ if(!FINISHED) postJSON({type:'progress', row:buildRow('progress')},{beacon:true}).catch(function(){}); },600);
}
document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='hidden'&&!FINISHED&&cur>0) postJSON({type:'progress',row:buildRow('progress')},{beacon:true}).catch(function(){}); });

var LAST_REC_TXT='';
function submitFinal(kind){
  var row=buildRow(kind), rew=(kind==='complete')?buildReward():null;
  var payload={type:'final', row:row, reward:rew};
  LAST_REC_TXT='[철도역 이용 경험 조사 · 응답 '+RESP_ID+']\n'+JSON.stringify(payload);
  var st=$('saveStatus'); if(st)st.textContent='응답을 저장하는 중…';
  try{ localStorage.setItem('survey_queue_'+RESP_ID, JSON.stringify(payload)); }catch(e){}
  var tries=0;
  function attempt(){
    tries++;
    return postJSON(payload).then(function(res){
      if(res&&res.ok){ onSaved(); }
      else throw new Error('bad-response');
    }).catch(function(err){
      if(tries<3) return new Promise(function(r){setTimeout(r,1500*tries)}).then(attempt);
      onFailed(err);
    });
  }
  attempt();
}
function onSaved(){
  try{ localStorage.removeItem('survey_queue_'+RESP_ID); }catch(e){}
  var st=$('saveStatus'); if(st){ st.textContent='✓ 응답이 저장되었습니다.'; st.style.color='var(--primary)'; }
}
function onFailed(err){
  var st=$('saveStatus'); if(st) st.textContent='';
  var box=$('fallbackBox'); if(!box)return;
  box.innerHTML='<div class="copy-fallback" style="text-align:center">'+
    '<p class="qsub" style="text-align:center;margin:.2rem 0 .6rem"><b style="color:var(--alert)">응답이 자동 저장되지 않았습니다.</b><br>인터넷 연결을 확인하고 아래 버튼을 눌러 다시 시도해 주세요.</p>'+
    '<button class="btn btn-primary" style="width:100%;margin-bottom:.55rem" onclick="retrySubmit()">다시 저장하기</button>'+
    '<button type="button" class="fb-toggle" id="pvToggle" aria-expanded="false">그래도 안 되면 — 응답 내용 복사해서 보내기</button>'+
    '<div id="pvArea" hidden style="margin-top:.4rem;text-align:left">'+
    '<p class="qsub">아래 버튼으로 복사한 뒤 <b style="color:var(--primary)">카카오톡 → 김형중과의 대화방</b>에 붙여넣어 보내 주세요.</p>'+
    '<button class="mini-btn" id="copyBtn" onclick="copyResult()">응답 내용 복사하기</button>'+
    '<textarea readonly id="fbTxt" style="width:100%;min-height:5rem;font-size:.72rem;border:1.5px solid var(--hair);border-radius:10px;padding:.5rem;font-family:monospace;background:var(--white);color:var(--ink);margin-top:.4rem"></textarea>'+
    '</div></div>';
  $('fbTxt').value=LAST_REC_TXT;
  var pv=$('pvToggle'), pa=$('pvArea');
  pv.onclick=function(){pa.hidden=!pa.hidden; pv.setAttribute('aria-expanded',String(!pa.hidden));};
}
function retrySubmit(){
  var raw=null; try{ raw=localStorage.getItem('survey_queue_'+RESP_ID); }catch(e){}
  var payload=raw?JSON.parse(raw):null; if(!payload)return;
  var box=$('fallbackBox'); if(box)box.innerHTML='';
  var st=$('saveStatus'); if(st)st.textContent='다시 저장하는 중…';
  postJSON(payload).then(function(res){ if(res&&res.ok)onSaved(); else onFailed(); }).catch(onFailed);
}
function copyResult(){
  var ok=copyPlain(LAST_REC_TXT), b=$('copyBtn');
  if(b) b.textContent= ok?'복사되었습니다 — 카카오톡에 붙여넣어 주세요':'복사가 안 되면 아래 내용을 길게 눌러 직접 복사해 주세요';
}
function copyPlain(txt){
  var ok=false;
  try{ var ta=document.createElement('textarea'); ta.value=txt; ta.setAttribute('readonly','');
    ta.style.position='fixed'; ta.style.left='-9999px'; ta.style.top='0'; document.body.appendChild(ta);
    ta.focus(); ta.select(); try{ta.setSelectionRange(0,txt.length)}catch(e){}
    ok=document.execCommand('copy'); document.body.removeChild(ta); }catch(e){ ok=false; }
  try{ if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(function(){},function(){}); } }catch(e){}
  return ok;
}
/* 이전 방문에서 저장 실패한 응답이 남아 있으면 조용히 재전송 */
(function flushQueue(){
  if(!ENDPOINT) return;
  try{
    for(var i=0;i<localStorage.length;i++){
      var k=localStorage.key(i); if(!k||k.indexOf('survey_queue_')!==0) continue;
      var raw=localStorage.getItem(k); if(!raw) continue;
      (function(key,pl){ postJSON(JSON.parse(pl)).then(function(res){ if(res&&res.ok) localStorage.removeItem(key); }).catch(function(){}); })(k,raw);
    }
  }catch(e){}
})();

/* ===== boot ===== */
if(IS_B){ $('modeChip').hidden=false; }
document.title = IS_B ? '철도역 이용 경험 조사 사전 테스트' : '철도역 이용 경험 조사';
render();
</script>
